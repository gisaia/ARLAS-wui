@let visu = visualisation();
@let previewImg = preview();
@if (visu && previewImg) {
<button class="manager__button" (click)="openModal()" [matTooltip]="'Change visualisation' | translate" matTooltipPosition="above">
    <arlas-cog-preview [title]="visu.name" [preview]="previewImg"></arlas-cog-preview>
</button>
}
